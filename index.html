<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개표 메이커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .canvas-area { width: 2160px; height: 1730px; position: relative; background: #222; transform: scale(0.3); transform-origin: top left; }
        
        /* 파일철 & 종이 */
        .folder { position: absolute; top: 100px; left: 100px; width: 1900px; height: 1600px; background: #8b0000; transform: rotate(-2deg); box-shadow: 30px 30px 60px rgba(0,0,0,0.8); }
        .paper-main { position: absolute; top: 50px; left: 100px; width: 1700px; height: 1500px; background: white; transform: rotate(2deg); color: black; padding: 100px; }
        
        /* 선택지 태그 */
        .tag { background: #eee; padding: 5px 15px; border-radius: 5px; margin-right: 10px; font-weight: bold; }
        
        /* 이미지 제어 */
        .img-container { position: relative; display: inline-block; border: 2px solid #000; margin: 10px; }
        .tape { position: absolute; top: -20px; left: 50%; width: 100px; height: 30px; background: rgba(255,255,255,0.5); transform: rotate(-10deg); }
    </style>
</head>
<body>

<h1 class="text-3xl font-bold mb-10">자기소개표 메이커</h1>

<div class="flex gap-10 w-full max-w-6xl">
    <div class="w-1/3 bg-gray-800 p-6 rounded-lg space-y-4">
        <h2 class="text-xl font-bold">보고서 설정</h2>
        <input type="text" id="nick" placeholder="닉네임" class="w-full p-2 text-black">
        <select id="age" class="w-full p-2 text-black"><option>성인</option><option>미성년자</option><option>비밀</option></select>
        <div id="image-controls" class="border p-4 rounded">
            <p>이미지 크기 조절</p>
            <input type="range" id="sizeRange" min="50" max="500" value="200" class="w-full">
        </div>
        <button onclick="save()" class="w-full bg-green-600 py-4 font-bold text-lg">저장하기</button>
    </div>

    <div class="canvas-area" id="capture">
        <div class="folder">
            <div class="paper-main">
                <div id="result-nick" class="text-7xl font-bold">닉네임</div>
                <div class="h-1 bg-black my-10"></div>
                <div id="image-slot" class="mt-20"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function save() {
        html2canvas(document.getElementById('capture'), {width: 2160, height: 1730}).then(canvas => {
            const link = document.createElement('a');
            link.download = '자기소개표.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>
</body>
</html>
