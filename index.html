<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개표</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --folder-color: #8b0000;
            --paper-color: #ffffff;
            --text-color: #000000;
            --font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #2c2c2c;
            color: #fff;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 컨트롤 패널 (잘림 방지 구조 개선) */
        #controls-wrapper {
            width: 400px;
            min-width: 400px;
            height: 100vh;
            background: #333;
            border-right: 2px solid #555;
            display: flex;
            flex-direction: column;
        }

        #controls {
            flex: 1;
            padding: 20px;
            overflow-y: auto; /* 내부 스크롤 보장 */
            padding-bottom: 80px; /* 하단 여유 공간 추가 */
        }

        #controls h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
            background: #444;
            padding: 10px;
            border-radius: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="color"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0 10px 0;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .radio-group label, .checkbox-group label {
            display: inline-block;
            background: #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .checkbox-group input[type="checkbox"], .radio-group input[type="radio"] {
            display: none;
        }

        .checkbox-group input[type="checkbox"]:checked + label,
        .radio-group input[type="radio"]:checked + label {
            background: #fff;
            color: #000;
            font-weight: bold;
        }

        /* 저장 버튼 (하단 고정 느낌으로 잘림 방지) */
        .save-btn-container {
            padding: 15px 20px;
            background: #333;
            border-top: 1px solid #555;
        }

        button.save-btn {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button.save-btn:hover { background: #45a049; }

        /* 오른쪽 프리뷰 */
        #preview-wrapper {
            flex: 1;
            overflow: auto; 
            padding: 20px;
            background-color: #2c2c2c;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* 찌그러짐 방지를 위한 캔버스 컨테이너 */
        #canvas-scale-wrapper {
            width: 864px; /* 2160 * 0.4 */
            height: 692px; /* 1730 * 0.4 */
            position: relative;
            margin: 20px;
        }

        /* 실제 캡처될 캔버스 (2160x1730 고정) */
        #canvas-area {
            width: 2160px;
            height: 1730px;
            min-width: 2160px;
            min-height: 1730px;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.4); 
            transform-origin: top left;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            font-family: var(--font-family);
            color: var(--text-color);
        }

        /* 파일철 및 종이 기본 세팅 */
        .folder {
            position: absolute;
            top: 4%;
            left: 4%;
            width: 92%;
            height: 92%;
            background-color: var(--folder-color);
            transform: rotate(-1.5deg); 
            border-radius: 10px 30px 10px 10px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .folder::before {
            content: '';
            position: absolute;
            top: -40px;
            right: 50px;
            width: 400px;
            height: 50px;
            background-color: var(--folder-color);
            border-radius: 20px 20px 0 0;
        }
        .paper-bg {
            position: absolute;
            width: 86%;
            height: 90%;
            background-color: #f0f0f0;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .paper-bg.p1 { transform: rotate(2deg); }
        .paper-bg.p2 { transform: rotate(-1deg); }

        /* 메인 보고서 종이 - 레이아웃 변경 (좌우 분할) */
        .paper-main {
            position: absolute;
            width: 85%;
            height: 92%;
            background-color: var(--paper-color);
            transform: rotate(1.5deg); 
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            padding: 60px;
            box-sizing: border-box;
            display: flex; /* 좌/우 단 나누기 */
            flex-direction: row;
            gap: 50px;
        }

        /* ---------------- 좌측 영역 (정보, 성향, 자유작성) ---------------- */
        .column-left {
            flex: 7; /* 좌측 비율 7 */
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 상단 프로필 구역 압축 */
        .header-section { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
        }
        .info-table { 
            width: 65%; 
            font-size: 26px; /* 폰트 축소 */
            border-collapse: collapse; 
        }
        .info-table td { 
            padding: 8px 0; /* 패딩 축소 */
            border-bottom: 2px solid var(--text-color); 
        }
        .info-table td:first-child { 
            font-weight: bold; 
            width: 120px; 
        }
        
        .profile-img-container {
            width: 250px; /* 프로필 사진 크기 축소 */
            height: 320px;
            border: 4px solid var(--text-color);
            position: relative;
            overflow: hidden;
            background: #ccc;
        }
        .profile-img-container img {
            position: absolute;
            transform-origin: center;
        }

        hr {
            width: 100%;
            border: none;
            border-top: 3px solid var(--text-color);
            margin: 20px 0; /* 여백 축소 */
        }

        /* 성향/탐라 구역 압축 */
        .section-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 10px;
        }
        .tag-display-area { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        .tag-badge {
            font-size: 22px; /* 폰트 축소 */
            font-weight: bold;
            padding: 6px 18px; /* 패딩 축소 */
            border: 2px solid var(--text-color);
            border-radius: 40px;
        }
        .tag-badge.selected {
            background-color: var(--text-color);
            color: var(--paper-color);
        }

        /* 자유작성란 (비율 대폭 확대) */
        .free-text-area {
            flex: 1; /* 남은 공간을 모두 차지함 */
            font-size: 32px; /* 폰트 키움 */
            white-space: pre-wrap;
            line-height: 1.5;
            padding: 10px;
            background-color: rgba(0,0,0,0.02); /* 시각적 구분을 위한 아주 옅은 배경 */
            border-radius: 10px;
            overflow: hidden;
        }


        /* ---------------- 우측 영역 (첨부파일 사이드 배치) ---------------- */
        .column-right {
            flex: 3; /* 우측 비율 3 */
            display: flex;
            flex-direction: column;
            gap: 30px; /* 사진 사이 간격 */
            justify-content: space-between;
            height: 100%;
            border-left: 2px dashed var(--text-color); /* 좌우 구분선 */
            padding-left: 40px;
        }

        .attach-box {
            flex: 1;
            position: relative;
            background: #eaeaea;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--text-color);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }
        
        .attach-box .tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 100px;
            height: 35px;
            background: rgba(255, 235, 138, 0.7);
            z-index: 10;
        }

        /* 이미지 크기 조절을 위한 내부 구조 변경 */
        .attach-box .img-viewport {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #fff;
        }

        .attach-box .img-area {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transform-origin: center;
            /* transform: scale(1)은 JS에서 조절 */
        }
        
        .attach-box .text-area {
            height: 45px;
            background: var(--paper-color);
            border-top: 2px dashed var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div id="controls-wrapper">
        <div id="controls">
            <h2>자기소개표 설정</h2>
            
            <div class="control-group">
                <label>배경 색상</label>
                <input type="color" id="bgColor" value="#1a1a1a">
                <label style="margin-top:10px;">배경 이미지 첨부</label>
                <input type="file" id="bgImage" accept="image/*">
            </div>

            <div class="control-group">
                <label>파일철 색상</label>
                <input type="color" id="folderColor" value="#8b0000">
                <label style="margin-top:10px;">종이 색상</label>
                <input type="color" id="paperColor" value="#ffffff">
                <label style="margin-top:10px;">글자 색상</label>
                <input type="color" id="textColor" value="#000000">
            </div>

            <div class="control-group">
                <label>폰트 선택</label>
                <select id="fontSelect">
                    <option value="'Noto Sans KR'">Noto Sans KR</option>
                    <option value="'Nanum Myeongjo'">Nanum Myeongjo</option>
                    <option value="'Gowun Dodum'">Gowun Dodum</option>
                    <option value="'Jua'">Jua</option>
                </select>
            </div>

            <div class="control-group">
                <label>닉네임</label>
                <input type="text" id="inputNickname" value="닉네임">
                <label style="margin-top:10px;">나이</label>
                <div class="radio-group">
                    <input type="radio" name="age" id="age1" value="성인" checked><label for="age1">성인</label>
                    <input type="radio" name="age" id="age2" value="미성년자"><label for="age2">미성년자</label>
                    <input type="radio" name="age" id="age3" value="비밀"><label for="age3">비밀</label>
                </div>
                
                <label style="margin-top:10px;">@ (아이디)</label>
                <input type="text" id="inputId" value="@username">

                <label style="margin-top:10px;">이별 방식</label>
                <div class="radio-group">
                    <input type="radio" name="parting" id="part1" value="블블" checked><label for="part1">블블</label>
                    <input type="radio" name="parting" id="part2" value="블언블"><label for="part2">블언블</label>
                </div>

                <label style="margin-top:10px;">장르</label>
                <input type="text" id="inputGenre" value="장르명">
            </div>

            <div class="control-group">
                <label>메인 프로필 이미지</label>
                <input type="file" id="profileImg" accept="image/*">
                <label>크기 조절</label>
                <input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1">
                <label>가로 위치 (X)</label>
                <input type="range" id="imgX" min="-500" max="500" value="0">
                <label>세로 위치 (Y)</label>
                <input type="range" id="imgY" min="-500" max="500" value="0">
                <label>방향 (회전)</label>
                <input type="range" id="imgRotate" min="-180" max="180" value="0">
            </div>

            <div class="control-group">
                <label>성향 (자유 선택)</label>
                <div class="checkbox-group" id="traitChecks">
                    <input type="checkbox" id="t1" value="HL"><label for="t1">HL</label>
                    <input type="checkbox" id="t2" value="BL"><label for="t2">BL</label>
                    <input type="checkbox" id="t3" value="GL"><label for="t3">GL</label>
                    <input type="checkbox" id="t4" value="NCP"><label for="t4">NCP</label>
                    <input type="checkbox" id="t5" value="ALL"><label for="t5">ALL</label>
                    <input type="checkbox" id="t6" value="Dream"><label for="t6">Dream</label>
                    <input type="checkbox" id="t7" value="CP"><label for="t7">CP</label>
                </div>
            </div>

            <div class="control-group">
                <label>탐라 (자유 선택)</label>
                <div class="checkbox-group" id="tlChecks">
                    <input type="checkbox" id="tl1" value="구독"><label for="tl1">구독</label>
                    <input type="checkbox" id="tl2" value="소비"><label for="tl2">소비</label>
                    <input type="checkbox" id="tl3" value="로그"><label for="tl3">로그</label>
                    <input type="checkbox" id="tl4" value="연성"><label for="tl4">연성</label>
                    <input type="checkbox" id="tl5" value="사담"><label for="tl5">사담</label>
                    <input type="checkbox" id="tl6" value="RT"><label for="tl6">RT</label>
                    <input type="checkbox" id="tl7" value="인용"><label for="tl7">인용</label>
                    <input type="checkbox" id="tl8" value="마음"><label for="tl8">마음</label>
                    <input type="checkbox" id="tl9" value="탐라 대화"><label for="tl9">탐라 대화</label>
                    <input type="checkbox" id="tl10" value="프롬프트"><label for="tl10">프롬프트</label>
                </div>
            </div>

            <div class="control-group">
                <label>자유 작성란 (영역 넓어짐)</label>
                <textarea id="inputFreeText" rows="6">자유롭게 입력하세요.</textarea>
            </div>

            <div class="control-group">
                <label>사이드 첨부파일 (사진 크기 조절 추가)</label>
                <hr style="margin:10px 0; border-top:1px solid #555;">
                <label>사진 1</label>
                <input type="file" id="attach1" accept="image/*">
                <input type="range" id="scale1" min="0.1" max="3" step="0.1" value="1" title="크기 조절">
                <input type="text" id="attachText1" placeholder="사진 1 설명">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                <label>사진 2</label>
                <input type="file" id="attach2" accept="image/*">
                <input type="range" id="scale2" min="0.1" max="3" step="0.1" value="1" title="크기 조절">
                <input type="text" id="attachText2" placeholder="사진 2 설명">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                <label>사진 3</label>
                <input type="file" id="attach3" accept="image/*">
                <input type="range" id="scale3" min="0.1" max="3" step="0.1" value="1" title="크기 조절">
                <input type="text" id="attachText3" placeholder="사진 3 설명">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                <label>사진 4</label>
                <input type="file" id="attach4" accept="image/*">
                <input type="range" id="scale4" min="0.1" max="3" step="0.1" value="1" title="크기 조절">
                <input type="text" id="attachText4" placeholder="사진 4 설명">
            </div>
        </div>
        
        <div class="save-btn-container">
            <button class="save-btn" onclick="saveImage()">저장하기</button>
        </div>
    </div>

    <div id="preview-wrapper">
        <div id="canvas-scale-wrapper">
            <div id="canvas-
