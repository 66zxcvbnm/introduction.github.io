<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자기소개표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 2160x1730 비율을 유지하면서 캔버스 구현 */
        #render-area { width: 2160px; height: 1730px; background: #222; position: relative; transform-origin: top left; }
        
        /* 파일철 & 종이 */
        .folder { width: 1800px; height: 1500px; background: #8b0000; position: absolute; top: 100px; left: 180px; transform: rotate(-2deg); box-shadow: 20px 20px 40px rgba(0,0,0,0.5); }
        .paper-main { width: 1600px; height: 1400px; background: white; position: absolute; top: 50px; left: 100px; padding: 80px; transform: rotate(2deg); color: black; }
        
        /* 선택지 태그 스타일 */
        .tag-box { padding: 5px 15px; border-radius: 4px; font-weight: bold; margin: 5px; display: inline-block; }
    </style>
</head>
<body class="bg-gray-900 p-10">

<div class="flex gap-10">
    <div class="w-1/3 bg-gray-800 p-8 rounded-2xl text-white">
        <h1 class="text-3xl font-bold mb-6">자기소개표 설정</h1>
        <div class="mb-4">
            <label>닉네임</label>
            <input type="text" id="nickname" class="w-full p-2 text-black mt-1">
        </div>
        <button onclick="saveCanvas()" class="w-full bg-green-600 py-4 mt-6 rounded-lg font-bold">저장하기</button>
    </div>

    <div class="w-2/3 scale-[0.25] origin-top-left">
        <div id="render-area">
            <div class="folder">
                <div class="paper-main">
                    <div id="display-nick" class="text-8xl font-bold">닉네임</div>
                    <div class="w-full h-1 bg-black my-8"></div>
                    <div id="tags-container"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function saveCanvas() {
        // 고화질 저장을 위한 캔버스 캡처
        html2canvas(document.getElementById('render-area'), {
            width: 2160, 
            height: 1730,
            scale: 1 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = '자기소개표.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>
</body>
</html>
