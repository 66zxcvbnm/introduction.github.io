<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자기소개표 메이커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --main-text: #000; --bg-color: #ffffff; }
        body { background: #1a1a1a; color: white; padding: 20px; }
        #canvas { width: 2160px; height: 1730px; background: #333; position: relative; overflow: hidden; transform-origin: top left; }
        
        /* 파일철 디자인 */
        .folder { width: 1900px; height: 1500px; background: #8b0000; margin: 100px auto; transform: rotate(-2deg); position: relative; box-shadow: 20px 20px 50px rgba(0,0,0,0.5); }
        .paper-stack { position: absolute; top: 50px; left: 100px; width: 1700px; height: 1400px; background: white; transform: rotate(2deg); padding: 60px; color: black; }
        
        /* 선택지 스타일 */
        .badge { padding: 4px 10px; border-radius: 4px; display: inline-block; margin: 5px; font-weight: bold; }
        .divider { height: 2px; background: #ccc; margin: 20px 0; }
    </style>
</head>
<body>

<div class="flex gap-10">
    <div class="w-1/3 bg-gray-800 p-6 rounded-xl">
        <h2 class="text-2xl font-bold mb-4">자기소개표 설정</h2>
        <input type="text" id="nickname" placeholder="닉네임" class="w-full p-2 mb-2 text-black">
        <select id="ageType" class="w-full p-2 mb-2 text-black">
            <option>성인</option><option>미성년자</option><option>비밀</option>
        </select>
        <button onclick="generate()" class="w-full bg-green-600 p-4 rounded mt-4 font-bold">저장하기</button>
    </div>

    <div class="w-2/3 scale-[0.3] origin-top-left">
        <div id="canvas">
            <div class="folder">
                <div class="paper-stack">
                    <h1 id="disp-nick" class="text-6xl font-bold">닉네임</h1>
                    <div class="divider"></div>
                    <div id="disp-tags" class="text-3xl"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function generate() {
        const nick = document.getElementById('nickname').value;
        document.getElementById('disp-nick').innerText = nick;
        
        html2canvas(document.getElementById('canvas'), {width: 2160, height: 1730}).then(canvas => {
            const link = document.createElement('a');
            link.download = '자기소개표.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>
</body>
</html>
