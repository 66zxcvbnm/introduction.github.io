<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개표</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --folder-color: #8b0000;
            --paper-color: #ffffff;
            --text-color: #000000;
            --font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            margin: 0; padding: 0; display: flex;
            background-color: #2c2c2c; color: #fff;
            font-family: sans-serif; height: 100vh; overflow: hidden;
        }

        /* --- 왼쪽 설정 패널 --- */
        #sidebar-wrap {
            width: 420px; min-width: 420px; height: 100vh;
            display: flex; flex-direction: column;
            background: #333; border-right: 2px solid #555; z-index: 100;
        }

        #controls { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }

        #save-section {
            padding: 20px; background: #222; border-top: 1px solid #444; flex-shrink: 0;
        }

        #controls h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #555; padding-bottom: 10px; }

        .control-group { margin-bottom: 15px; background: #444; padding: 15px; border-radius: 5px; }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }

        input[type="text"], input[type="color"], select, textarea {
            width: 100%; padding: 8px; box-sizing: border-box;
            background: #222; color: #fff; border: 1px solid #555; border-radius: 4px;
        }

        input[type="range"] { width: 100%; margin: 5px 0 10px 0; }

        .radio-group, .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }

        .radio-group label, .checkbox-group label {
            display: inline-block; background: #555; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-size: 0.8rem;
        }

        .checkbox-group input[type="checkbox"], .radio-group input[type="radio"] { display: none; }
        .checkbox-group input[type="checkbox"]:checked + label,
        .radio-group input[type="radio"]:checked + label {
            background: #fff; color: #000; font-weight: bold;
        }

        button.save-btn {
            width: 100%; padding: 15px; background: #4CAF50; color: white;
            border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 5px;
        }
        button.save-btn:hover { background: #45a049; }

        /* --- 오른쪽 미리보기 화면 --- */
        #preview-container {
            flex: 1; background-color: #111;
            display: flex; align-items: center; justify-content: center;
            overflow: auto; padding: 40px;
        }

        .canvas-scaler {
            width: 864px; height: 692px; flex-shrink: 0; position: relative;
        }

        /* 실제 저장될 2160x1730 캔버스 */
        #canvas-area {
            width: 2160px; height: 1730px;
            background-color: var(--bg-color); background-size: cover; background-position: center;
            position: absolute; top: 0; left: 0;
            transform: scale(0.4); transform-origin: top left;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-family: var(--font-family); color: var(--text-color);
            overflow: hidden;
        }

        /* 파일철 디자인 */
        .folder {
            position: absolute; top: 4%; left: 4%;
            width: 90%; height: 92%;
            background-color: var(--folder-color);
            transform: rotate(-1.5deg); 
            border-radius: 10px 30px 10px 10px;
            box-shadow: 10px 10px 40px rgba(0,0,0,0.6);
        }
        .folder::before {
            content: ''; position: absolute; top: -40px; right: 80px;
            width: 450px; height: 50px; background-color: var(--folder-color);
            border-radius: 20px 20px 0 0;
        }
        .paper-bg {
            position: absolute; width: 86%; height: 90%;
            background-color: #f0f0f0; box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .paper-bg.p1 { transform: rotate(2deg); top: 5%; left: 5%; }
        .paper-bg.p2 { transform: rotate(-1deg); top: 4%; left: 6%; }

        /* 메인 보고서 종이 */
        .paper-main {
            position: absolute; top: 4%; left: 5%;
            width: 68%; /* 사이드 사진 공간 확보 */
            height: 92%;
            background-color: var(--paper-color);
            transform: rotate(1.5deg); 
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            padding: 80px 60px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        .header-section { display: flex; justify-content: space-between; align-items: flex-start; }
        .info-table { width: 55%; font-size: 32px; border-collapse: collapse; }
        .info-table td { padding: 15px 0; border-bottom: 2px solid var(--text-color); }
        .info-table td:first-child { font-weight: bold; width: 140px; }
        
        .profile-img-container {
            width: 320px; height: 420px;
            border: 6px solid var(--text-color);
            position: relative; overflow: hidden; background: #ccc;
        }
        .profile-img-container img { position: absolute; transform-origin: center; }

        hr {
            width: 100%; border: none; border-top: 4px solid var(--text-color);
            margin: 30px 0; 
        }

        .section-title { font-size: 32px; font-weight: bold; margin-bottom: 15px; margin-top: 10px; }
        .tag-display-area { display: flex; flex-wrap: wrap; gap: 15px; }
        .tag-badge {
            font-size: 28px; font-weight: bold; padding: 8px 22px; 
            border: 3px solid var(--text-color); border-radius: 50px;
        }
        /* 선택된 배지 글자색 반전 */
        .tag-badge.selected { background-color: var(--text-color); color: var(--paper-color); }

        .free-text-area {
            flex: 1; font-size: 35px; white-space: pre-wrap; line-height: 1.6;
            padding: 20px; background-color: rgba(0,0,0,0.03); border-radius: 15px;
        }

        /* --- 사이드 보고서 사진 프레임 (마스킹 테이프 고정) --- */
        #side-photos-wrap {
            position: absolute;
            right: 3%; /* 우측 배치 */
            top: 5%;
            width: 25%; /* 너비 */
            height: 90%;
            display: flex;
            flex-direction: column;
            gap: 40px; /* 사진 사이 간격 */
            z-index: 50; /* 종이 위로 겹침 */
        }

        .attached-photo-group {
            position: relative;
            background-color: var(--paper-color); /* 종이 색상과 동일 */
            padding: 15px 15px 40px 15px; /* 프레임 여백 (하단은 글씨 공간) */
            box-sizing: border-box;
            border: 2px solid #ccc; /* 연한 액자 프레임 */
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
            transform: rotate(2deg); /* 살짝 비스듬하게 기본값 */
            display: none; /* 첨부 전엔 숨김 */
        }

        /* 마스킹 테이프 효과 */
        .attached-photo-group::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            width: 120px;
            height: 35px;
            background-color: rgba(255, 230, 100, 0.6); /* 투명 yellowish washi tape */
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .photo-img-viewport {
            width: 100%;
            height: 250px; /* 고정 크기 뷰포트 */
            background: #eee;
            overflow: hidden;
            position: relative;
            border: 1px solid #999;
        }

        .photo-img-area {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transform-origin: center;
        }

        /* 사진 아래 글씨 영역 */
        .photo-caption {
            width: 100%;
            margin-top: 15px;
            text-align: center;
            font-size: 26px;
            color: var(--text-color);
            font-weight: bold;
            word-wrap: break-word;
        }

    </style>
</head>
<body>

    <div id="sidebar-wrap">
        <div id="controls">
            <h2>자기소개표 설정</h2>
            
            <div class="control-group">
                <label>배경 색상</label>
                <input type="color" id="bgColor" value="#1a1a1a">
                <label style="margin-top:10px;">배경 이미지 첨부</label>
                <input type="file" id="bgImage" accept="image/*">
            </div>

            <div class="control-group">
                <label>파일철 색상</label>
                <input type="color" id="folderColor" value="#8b0000">
                <label style="margin-top:10px;">종이 색상</label>
                <input type="color" id="paperColor" value="#ffffff">
                <label style="margin-top:10px;">글자 색상</label>
                <input type="color" id="textColor" value="#000000">
            </div>

            <div class="control-group">
                <label>폰트 선택</label>
                <select id="fontSelect">
                    <option value="'Noto Sans KR'">Noto Sans KR</option>
                    <option value="'Nanum Myeongjo'">Nanum Myeongjo</option>
                    <option value="'Gowun Dodum'">Gowun Dodum</option>
                    <option value="'Jua'">Jua</option>
                </select>
            </div>

            <div class="control-group">
                <label>닉네임</label>
                <input type="text" id="inputNickname" value="닉네임">
                
                <label style="margin-top:10px;">나이</label>
                <div class="radio-group">
                    <input type="radio" name="age" id="age1" value="성인" checked><label for="age1">성인</label>
                    <input type="radio" name="age" id="age2" value="미성년자"><label for="age2">미성년자</label>
                    <input type="radio" name="age" id="age3" value="비밀"><label for="age3">비밀</label>
                </div>
                
                <label style="margin-top:10px;">@ (아이디)</label>
                <input type="text" id="inputId" value="@username">

                <label style="margin-top:10px;">이별 방식</label>
                <div class="radio-group">
                    <input type="radio" name="parting" id="part1" value="블블" checked><label for="part1">블블</label>
                    <input type="radio" name="parting" id="part2" value="블언블"><label for="part2">블언블</label>
                </div>

                <label style="margin-top:10px;">장르</label>
                <input type="text" id="inputGenre" value="장르명">
            </div>

            <div class="control-group">
                <label>메인 프로필 이미지</label>
                <input type="file" id="profileImg" accept="image/*">
                <label>크기 조절</label>
                <input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1">
                <label>가로 위치 (X)</label>
                <input type="range" id="imgX" min="-500" max="500" value="0">
                <label>세로 위치 (Y)</label>
                <input type="range" id="imgY" min="-500" max="500" value="0">
                <label>방향 (회전)</label>
                <input type="range" id="imgRotate" min="-180" max="180" value="0">
            </div>

            <div class="control-group">
                <label>성향 (자유 선택)</label>
                <div class="checkbox-group" id="traitChecks">
                    <input type="checkbox" id="t1" value="HL"><label for="t1">HL</label>
                    <input type="checkbox" id="t2" value="BL"><label for="t2">BL</label>
                    <input type="checkbox" id="t3" value="GL"><label for="t3">GL</label>
                    <input type="checkbox" id="t4" value="NCP"><label for="t4">NCP</label>
                    <input type="checkbox" id="t5" value="ALL"><label for="t5">ALL</label>
                    <input type="checkbox" id="t6" value="Dream"><label for="t6">Dream</label>
                    <input type="checkbox" id="t7" value="CP"><label for="t7">CP</label>
                </div>
            </div>

            <div class="control-group">
                <label>탐라 (자유 선택)</label>
                <div class="checkbox-group" id="tlChecks">
                    <input type="checkbox" id="tl1" value="구독"><label for="tl1">구독</label>
                    <input type="checkbox" id="tl2" value="소비"><label for="tl2">소비</label>
                    <input type="checkbox" id="tl3" value="로그"><label for="tl3">로그</label>
                    <input type="checkbox" id="tl4" value="연성"><label for="tl4">연성</label>
                    <input type="checkbox" id="tl5" value="사담"><label for="tl5">사담</label>
                    <input type="checkbox" id="tl6" value="RT"><label for="tl6">RT</label>
                    <input type="checkbox" id="tl7" value="인용"><label for="tl7">인용</label>
                    <input type="checkbox" id="tl8" value="마음"><label for="tl8">마음</label>
                    <input type="checkbox" id="tl9" value="탐라 대화"><label for="tl9">탐라 대화</label>
                    <input type="checkbox" id="tl10" value="프롬프트"><label for="tl10">프롬프트</label>
                </div>
            </div>

            <div class="control-group">
                <label>자유 작성란</label>
                <textarea id="inputFreeText" rows="6">자유롭게 입력하세요.</textarea>
            </div>

            <div class="control-group">
                <label>사이드 보고서 사진 (마스킹 테이프 고정)</label>
                <hr style="margin:10px 0; border-top:1px solid #555;">
                
                <label>사진 1</label>
                <input type="file" id="attach1" accept="image/*">
                <input type="range" id="scale1" min="0.1" max="3" step="0.1" value="1" title="사진 크기 조절">
                <input type="text" id="attachText1" placeholder="사진 1 아래 글씨 입력...">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                
                <label>사진 2</label>
                <input type="file" id="attach2" accept="image/*">
                <input type="range" id="scale2" min="0.1" max="3" step="0.1" value="1" title="사진 크기 조절">
                <input type="text" id="attachText2" placeholder="사진 2 아래 글씨 입력...">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                
                <label>사진 3</label>
                <input type="file" id="attach3" accept="image/*">
                <input type="range" id="scale3" min="0.1" max="3" step="0.1" value="1" title="사진 크기 조절">
                <input type="text" id="attachText3" placeholder="사진 3 아래 글씨 입력...">
                <hr style="margin:10px 0; border-top:1px solid #555;">
                
                <label>사진 4</label>
                <input type="file" id="attach4" accept="image/*">
                <input type="range" id="scale4" min="0.1" max="3" step="0.1" value="1" title="사진 크기 조절">
                <input type="text" id="attachText4" placeholder="사진 4 아래 글씨 입력...">
            </div>
        </div>

        <div id="save-section">
            <button class="save-btn" onclick="saveImage()">저장하기</button>
        </div>
    </div>

    <div id="preview-container">
        <div class="canvas-scaler">
            <div id="canvas-area">
                
                <div class="folder">
                    <div class="paper-bg p1"></div>
                    <div class="paper-bg p2"></div>
                    
                    <div class="paper-main">
                        <div class="header-section">
                            <table class="info-table">
                                <tr>
                                    <td>NAME</td>
                                    <td><span id="outNickname">닉네임</span> <span id="outAge" style="font-size:24px; border:3px solid; padding:2px 10px; border-radius:12px; margin-left:10px;">성인</span></td>
                                }
                                <tr>
                                    <td>@</td>
                                    <td id="outId">@username</td>
                                </tr>
                                <tr>
                                    <td>이별</td>
                                    <td id="outParting">블블</td>
                                </tr>
                                <tr>
                                    <td>장르</td>
                                    <td id="outGenre">장르명</td>
                                </tr>
                            </table>
                            
                            <div class="profile-img-container">
                                <img id="outProfileImg" src="" style="display:none; width:100%;">
                            </div>
                        </div>

                        <hr>

                        <div class="section-title">성향</div>
                        <div class="tag-display-area" id="outTraits"></div>

                        <div class="section-title" style="margin-top: 20px;">탐라</div>
                        <div class="tag-display-area" id="outTl"></div>

                        <hr>

                        <div class="free-text-area" id="outFreeText">자유롭게 입력하세요.</div>
                    </div>
                </div>

                <div id="side-photos-wrap">
                    
                    <div class="attached-photo-group" id="box1" style="transform: rotate(2deg);">
                        <div class="photo-img-viewport">
                            <div class="photo-img-area" id="outAttach1"></div>
                        </div>
                        <div class="photo-caption" id="outAttachText1"></div>
                    </div>

                    <div class="attached-photo-group" id="box2" style="transform: rotate(-1deg);">
                        <div class="photo-img-viewport">
                            <div class="photo-img-area" id="outAttach2"></div>
                        </div>
                        <div class="photo-caption" id="outAttachText2"></div>
                    </div>

                    <div class="attached-photo-group" id="box3" style="transform: rotate(3deg);">
                        <div class="photo-img-viewport">
                            <div class="photo-img-area" id="outAttach3"></div>
                        </div>
                        <div class="photo-caption" id="outAttachText3"></div>
                    </div>

                    <div class="attached-photo-group" id="box4" style="transform: rotate(-2deg);">
                        <div class="photo-img-viewport">
                            <div class="photo-img-area" id="outAttach4"></div>
                        </div>
                        <div class="photo-caption" id="outAttachText4"></div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        const root = document.documentElement;

        // 색상 및 폰트 변경
        document.getElementById('bgColor').addEventListener('input', (e) => { root.style.setProperty('--bg-color', e.target.value); });
        document.getElementById('folderColor').addEventListener('input', (e) => { root.style.setProperty('--folder-color', e.target.value); });
        document.getElementById('paperColor').addEventListener('input', (e) => { root.style.setProperty('--paper-color', e.target.value); });
        document.getElementById('textColor').addEventListener('input', (e) => { root.style.setProperty('--text-color', e.target.value); });
        document.getElementById('fontSelect').addEventListener('change', (e) => { root.style.setProperty('--font-family', e.target.value); });

        // 배경 이미지 처리
        document.getElementById('bgImage').addEventListener('change', function(e) {
            if(e.target.files[0]) {
                const url = URL.createObjectURL(e.target.files[0]);
                document.getElementById('canvas-area').style.backgroundImage = `url(${url})`;
            }
        });

        // 텍스트 필드 바인딩
        const bindText = (inputId, outId) => {
            document.getElementById(inputId).addEventListener('input', (e) => {
                document.getElementById(outId).innerText = e.target.value;
            });
        };
        bindText('inputNickname', 'outNickname');
        bindText('inputId', 'outId');
        bindText('inputGenre', 'outGenre');
        bindText('inputFreeText', 'outFreeText');

        // 라디오 버튼 바인딩
        document.getElementsByName('age').forEach(radio => {
            radio.addEventListener('change', (e) => { document.getElementById('outAge').innerText = e.target.value; });
        });
        document.getElementsByName('parting').forEach(radio => {
            radio.addEventListener('change', (e) => { document.getElementById('outParting').innerText = e.target.value; });
        });

        // 체크박스 (배지) 바인딩 및 글자색 반전 처리
        const updateTags = (containerId, outId) => {
            const container = document.getElementById(containerId);
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            const outArea = document.getElementById(outId);
            
            const render = () => {
                outArea.innerHTML = '';
                checkboxes.forEach(cb => {
                    const div = document.createElement('div');
                    // 선택된 배지에 'selected' 클래스를 부여하여 CSS에서 글자색/배경색 반전
                    div.className = 'tag-badge ' + (cb.checked ? 'selected' : '');
                    div.innerText = cb.value;
                    outArea.appendChild(div);
                });
            };
            checkboxes.forEach(cb => cb.addEventListener('change', render));
            render();
        };
        updateTags('traitChecks', 'outTraits');
        updateTags('tlChecks', 'outTl');

        // 메인 이미지 트랜스폼
        const profileImg = document.getElementById('outProfileImg');
        let imgState = { scale: 1, x: 0, y: 0, rotate: 0 };
        const updateImgTransform = () => {
            profileImg.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale}) rotate(${imgState.rotate}deg)`;
        };
        document.getElementById('profileImg').addEventListener('change', (e) => {
            if(e.target.files[0]) {
                profileImg.src = URL.createObjectURL(e.target.files[0]);
                profileImg.style.display = 'block';
            }
        });
        document.getElementById('imgScale').addEventListener('input', (e) => { imgState.scale = e.target.value; updateImgTransform(); });
        document.getElementById('imgX').addEventListener('input', (e) => { imgState.x = e.target.value; updateImgTransform(); });
        document.getElementById('imgY').addEventListener('input', (e) => { imgState.y = e.target.value; updateImgTransform(); });
        document.getElementById('imgRotate').addEventListener('input', (e) => { imgState.rotate = e.target.value; updateImgTransform(); });

        // 사이드 첨부사진 처리 (마스킹 테이프 프레임)
        const handleAttach = (index) => {
            const fileInput = document.getElementById(`attach${index}`);
            const scaleInput = document.getElementById(`scale${index}`);
            const textInput = document.getElementById(`attachText${index}`);
            
            const box = document.getElementById(`box${index}`);
            const imgArea = document.getElementById(`outAttach${index}`);
            const textArea = document.getElementById(`outAttachText${index}`);

            // 사진 첨부
            fileInput.addEventListener('change', (e) => {
                if(e.target.files[0]) {
                    const url = URL.createObjectURL(e.target.files[0]);
                    box.style.display = 'block'; // 사진이 있으면 프레임 보이게
                    imgArea.style.backgroundImage = `url(${url})`;
                }
            });
            // 사진 크기 조절
            scaleInput.addEventListener('input', (e) => {
                imgArea.style.transform = `scale(${e.target.value})`;
            });
            // 사진 아래 글씨 입력
            textInput.addEventListener('input', (e) => {
                textArea.innerText = e.target.value;
            });
        };
        [1, 2, 3, 4].forEach(handleAttach);

        // 이미지 고화질 저장 기능
        function saveImage() {
            const canvasArea = document.getElementById('canvas-area');
            // 캡처 전 원본 크기(scale 1)로 변경
            canvasArea.style.transform = 'scale(1)'; 
            
            html2canvas(canvasArea, {
                scale: 1,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '자기소개표.png';
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                
                // 캡처 후 화면 맞춤 크기(scale 0.4)로 복원
                canvasArea.style.transform = 'scale(0.4)'; 
            });
        }
    </script>
</body>
</html>
